<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Basanta Saru's workout progress — documenting consistency and physical improvement one day at a time.">
  <title>Workout Progress | Basanta Saru</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261004-1">
  <link rel="stylesheet" href="design-system.css?v=20261004-1">
  <link rel="stylesheet" href="workout.css?v=20261004-2">
</head>
<body>
  <div id="navbar-container"></div>
  <main class="workout-page">
    <section class="workout-hero">
      <div class="workout-container">
        <p class="workout-kicker">MY NEXT VERSION · FITNESS</p>
        <h1>Workout progress</h1>
        <p class="workout-intro">A visual record of showing up, staying consistent, and becoming stronger one day at a time.</p>
      </div>
    </section>

    <section class="workout-feed" aria-labelledby="progress-title">
      <div class="workout-container">
        <div class="workout-heading">
          <div>
            <p class="workout-kicker">PROGRESS LOG</p>
            <h2 id="progress-title">The journey</h2>
          </div>
          <p>Real progress, documented as it happens.</p>
        </div>

        <div class="workout-grid">
          <article class="progress-card">
            <div class="progress-image">
              <img src="https://res.cloudinary.com/ywhjyljn/image/upload/f_auto,q_auto,w_900/v1791125713/IMG_20261004_070543.jpg"
                   alt="Basanta Saru workout progress on October 4, 2026"
                   width="900" height="1600" loading="eager">
              <span class="day-badge">OCT 04</span>
            </div>
            <div class="progress-copy">
              <div>
                <p class="progress-date">October 4, 2026</p>
                <h3>Showing up today.</h3>
              </div>
              <span class="progress-status">Workout progress</span>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>
  <script src="components.js"></script>
</body>
</html>
